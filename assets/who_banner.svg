        <circle cx="983" cy="210" r="3.3"/><circle cx="1022" cy="158" r="3.6"/><circle cx="1060" cy="267" r="3.2"/>
        <circle cx="865" cy="267" r="3.2"/><circle cx="915" cy="306" r="3.7"/><circle cx="973" cy="289" r="3.2"/>
        <circle cx="1006" cy="232" r="4"/><circle cx="1049" cy="326" r="3.4"/><circle cx="958" cy="343" r="3.1"/>
      </g>
