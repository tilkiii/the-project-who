        <circle cx="891" cy="180" r="2.3"/><circle cx="1021" cy="286" r="2.7"/><circle cx="932" cy="254" r="2.2"/><circle cx="1045" cy="219" r="2.2"/>
      </g>
    </g>
    <path d="M853 380c-23-24-36-55-39-87-3-37 8-77 31-105 23-28 60-47 99-47 44 0 80 20 100 52 12 20 17 42 17 61 0 9-2 17-2 23 0 6 5 10 14 15 9 5 12 11 8 17-3 5-11 7-18 8 7 4 9 9 7 14-2 5-8 9-17 10-2 12-8 22-18 29-8 6-16 7-26 8l-1 35c0 11 4 20 13 27l19 14H837c12-12 21-27 16-44z" fill="none" stroke="#8ee8d7" stroke-opacity=".78" stroke-width="1.4"/>

    <g font-family="Inter, Segoe UI, Arial, sans-serif">
