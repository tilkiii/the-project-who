    <circle cx="960" cy="250" r="169" fill="none" stroke="#a8c8d8" stroke-opacity=".12"/>
    <circle cx="960" cy="250" r="145" fill="none" stroke="#8eb2ca" stroke-opacity=".13" stroke-dasharray="2 9"/>
    <ellipse cx="960" cy="249" rx="191" ry="87" transform="rotate(-28 960 249)" fill="none" stroke="#78d9cf" stroke-opacity=".16"/>
    <ellipse cx="960" cy="249" rx="184" ry="71" transform="rotate(40 960 249)" fill="none" stroke="#91a8f3" stroke-opacity=".14"/>

