<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0e2a47" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#081324" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#040711" stop-opacity="1"/>
    </radialGradient>
    
    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>

    <!-- Isometric Face Gradients -->
    <!-- Front Face (Medium Light) -->
    <linearGradient id="frontGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Top Face (Brightest Light) -->
    <linearGradient id="topGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Side Face (Deep Shadow) -->
    <linearGradient id="sideGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>

    <!-- Deep Crevice Shadow -->
    <linearGradient id="shadowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#082f49"/>
      <stop offset="100%" stop-color="#031f33"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="15" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Deep High-Tech Background -->
  <rect width="1200" height="480" fill="url(#bgGlow)"/>

  <!-- Perspective Floor Grid -->
  <g opacity="0.35">
    <path d="M 0,380 L 1200,380 M 0,405 L 1200,405 M 0,435 L 1200,435 M 0,470 L 1200,470" stroke="url(#gridGrad)" stroke-width="1.5"/>
    <path d="M 600,340 L 0,480 M 600,340 L 200,480 M 600,340 L 400,480 M 600,340 L 600,480 M 600,340 L 800,480 M 600,340 L 1000,480 M 600,340 L 1200,480" stroke="url(#gridGrad)" stroke-width="1.5"/>
  </g>

  <!-- Ambient Light Reflection Behind Logo -->
  <ellipse cx="600" cy="220" rx="450" ry="140" fill="#0284c7" opacity="0.22" filter="url(#neonGlow)"/>

  <!-- ================= 3D ISOMETRIC BLOCK TYPOGRAPHY: "WHO??" ================= -->
  <g filter="url(#dropShadow)" transform="translate(140, 60)">

    <!-- ================= LETTER: W ================= -->
    <g transform="translate(0, 0)">
      <!-- Ground Shadow -->
      <polygon points="10,210 200,210 230,235 40,235" fill="#000" opacity="0.4"/>
      
      <!-- Side Extrusions (Depth) -->
      <!-- Left Column Depth -->
      <polygon points="0,40 30,15 30,175 0,200" fill="url(#sideGrad)"/>
      <!-- Internal Slants -->
      <polygon points="45,40 75,15 75,175 45,200" fill="url(#shadowGrad)"/>
      <polygon points="85,40 115,15 115,175 85,200" fill="url(#sideGrad)"/>
      <polygon points="130,40 160,15 160,175 130,200" fill="url(#shadowGrad)"/>
      <polygon points="170,40 200,15 200,175 170,200" fill="url(#sideGrad)"/>
      
      <!-- Top Bevel Faces -->
      <polygon points="0,40 30,15 75,15 45,40" fill="url(#topGrad)"/>
      <polygon points="85,80 115,55 135,55 105,80" fill="url(#topGrad)"/>
      <polygon points="140,40 170,15 200,15 170,40" fill="url(#topGrad)"/>

      <!-- Front Face (W) -->
      <path d="M 0,40 L 45,40 L 70,140 L 95,80 L 125,80 L 150,140 L 175,40 L 215,40 L 175,200 L 135,200 L 110,125 L 85,200 L 45,200 Z" 
            fill="url(#frontGrad)" stroke="#7dd3fc" stroke-width="2.5" stroke-linejoin="round"/>
      <!-- Inner Bevel Highlight -->
      <path d="M 5,45 L 40,45 L 68,145 L 95,85 L 125,85 L 152,145 L 175,45 L 210,45" 
            stroke="#bae6fd" stroke-width="1.5" fill="none" opacity="0.6"/>
    </g>

    <!-- ================= LETTER: H ================= -->
    <g transform="translate(240, 0)">
      <!-- Ground Shadow -->
      <polygon points="10,210 160,210 190,235 40,235" fill="#000" opacity="0.4"/>

      <!-- Side Depth -->
      <polygon points="0,40 30,15 30,175 0,200" fill="url(#sideGrad)"/>
      <polygon points="45,40 75,15 75,95 45,120" fill="url(#shadowGrad)"/>
      <polygon points="120,40 150,15 150,175 120,200" fill="url(#sideGrad)"/>
      
      <!-- Top Bevel Faces -->
      <polygon points="0,40 30,15 75,15 45,40" fill="url(#topGrad)"/>
      <polygon points="120,40 150,15 165,15 135,40" fill="url(#topGrad)"/>
      <polygon points="45,95 75,70 120,70 90,95" fill="url(#topGrad)"/>

      <!-- Front Face (H) -->
      <path d="M 0,40 L 45,40 L 45,95 L 120,95 L 120,40 L 165,40 L 165,200 L 120,200 L 120,135 L 45,135 L 45,200 L 0,200 Z" 
            fill="url(#frontGrad)" stroke="#7dd3fc" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M 5,45 L 40,45 M 125,45 L 160,45" stroke="#bae6fd" stroke-width="1.5" fill="none" opacity="0.6"/>
    </g>

    <!-- ================= LETTER: O ================= -->
    <g transform="translate(435, 0)">
      <!-- Ground Shadow -->
      <polygon points="10,210 170,210 200,235 40,235" fill="#000" opacity="0.4"/>

      <!-- Side Depth Outer -->
      <polygon points="0,70 30,45 30,150 0,175" fill="url(#sideGrad)"/>
      <polygon points="135,70 165,45 165,150 135,175" fill="url(#sideGrad)"/>
      <!-- Hole Side Depth -->
      <polygon points="45,90 75,65 75,130 45,155" fill="url(#shadowGrad)"/>

      <!-- Top Bevel Faces -->
      <polygon points="35,40 65,15 135,15 105,40" fill="url(#topGrad)"/>
      <polygon points="45,155 75,130 120,130 90,155" fill="url(#topGrad)"/>

      <!-- Front Face (O - Hexagonal Blocky Voxel) -->
      <path d="M 35,40 L 135,40 L 170,75 L 170,165 L 135,200 L 35,200 L 0,165 L 0,75 Z 
               M 45,85 L 45,155 L 75,170 L 95,170 L 125,155 L 125,85 L 95,70 L 75,70 Z" 
            fill-rule="evenodd" fill="url(#frontGrad)" stroke="#7dd3fc" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M 38,45 L 132,45" stroke="#bae6fd" stroke-width="1.5" fill="none" opacity="0.6"/>
    </g>

    <!-- ================= PUNCTUATION: ? ================= -->
    <g transform="translate(635, 0)">
      <!-- Side Depth -->
      <polygon points="0,70 30,45 30,105 0,130" fill="url(#sideGrad)"/>
      <polygon points="80,105 110,80 110,130 80,155" fill="url(#sideGrad)"/>
      <polygon points="35,170 65,145 65,175 35,200" fill="url(#sideGrad)"/>

      <!-- Top Bevel Faces -->
      <polygon points="35,40 65,15 110,15 80,40" fill="url(#topGrad)"/>
      <polygon points="35,170 65,145 110,145 80,170" fill="url(#topGrad)"/>

      <!-- Front Face (Top Hook) -->
      <path d="M 0,75 L 35,40 L 110,40 L 130,70 L 130,105 L 80,135 L 45,135 L 45,105 L 80,95 L 90,85 L 90,70 L 45,70 L 25,85 Z" 
            fill="url(#frontGrad)" stroke="#7dd3fc" stroke-width="2.5" stroke-linejoin="round"/>
      <!-- Dot Block -->
      <polygon points="45,170 90,170 90,200 45,200" fill="url(#frontGrad)" stroke="#7dd3fc" stroke-width="2.5" stroke-linejoin="round"/>
    </g>

    <!-- ================= PUNCTUATION: ? (Second) ================= -->
    <g transform="translate(775, 0)">
      <!-- Side Depth -->
      <polygon points="0,70 30,45 30,105 0,130" fill="url(#sideGrad)"/>
      <polygon points="80,105 110,80 110,130 80,155" fill="url(#sideGrad)"/>
      <polygon points="35,170 65,145 65,175 35,200" fill="url(#sideGrad)"/>

      <!-- Top Bevel Faces -->
      <polygon points="35,40 65,15 110,15 80,40" fill="url(#topGrad)"/>
      <polygon points="35,170 65,145 110,145 80,170" fill="url(#topGrad)"/>

      <!-- Front Face (Top Hook) -->
      <path d="M 0,75 L 35,40 L 110,40 L 130,70 L 130,105 L 80,135 L 45,135 L 45,105 L 80,95 L 90,85 L 90,70 L 45,70 L 25,85 Z" 
            fill="url(#frontGrad)" stroke="#7dd3fc" stroke-width="2.5" stroke-linejoin="round"/>
      <!-- Dot Block -->
      <polygon points="45,170 90,170 90,200 45,200" fill="url(#frontGrad)" stroke="#7dd3fc" stroke-width="2.5" stroke-linejoin="round"/>
    </g>

  </g>

  <!-- Tagline Text (Sleek Clean Modern San-Serif) -->
  <text x="600" y="360" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="21" font-weight="600" fill="#f8fafc" letter-spacing="0.5">
    Enterprise Multimodal OSINT Engine &amp; Evidence-Based Digital Twin Framework
  </text>

  <!-- Sub-bullet Features -->
  <text x="600" y="398" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="14.5" font-weight="400" fill="#38bdf8" letter-spacing="1">
    Neo4j GDS Graph Intelligence • BERTopic Evolution • 7-Layer Memory • Probabilistic Epistemology
  </text>
  
  <!-- Glowing Horizontal Rule -->
  <line x1="250" y1="430" x2="950" y2="430" stroke="#0284c7" stroke-width="1.5" opacity="0.6"/>
  <circle cx="600" cy="430" r="4" fill="#38bdf8" filter="url(#neonGlow)"/>
</svg>
