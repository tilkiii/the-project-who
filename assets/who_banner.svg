        <circle cx="15" cy="16" r="4" fill="#6cddc6"/><text x="27" y="20" fill="#c6d5e1" font-size="10" letter-spacing=".6">SOURCES</text>
      </g>
      <g transform="translate(1051 129)">
        <rect width="112" height="32" rx="9" fill="#101f2e" stroke="#89aebe" stroke-opacity=".3"/>
        <circle cx="15" cy="16" r="4" fill="#9d9af0"/><text x="27" y="20" fill="#c6d5e1" font-size="10" letter-spacing=".6">TOPIC TRAILS</text>
      </g>
      <g transform="translate(1044 358)">
        <rect width="120" height="32" rx="9" fill="#101f2e" stroke="#89aebe" stroke-opacity=".3"/>
        <circle cx="15" cy="16" r="4" fill="#79c9e2"/><text x="27" y="20" fill="#c6d5e1" font-size="10" letter-spacing=".6">EXPLAINABLE</text>
