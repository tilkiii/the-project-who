<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" width="100%" height="100%" style="background: transparent; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace;">
  <defs>
    <linearGradient id="terminalBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Outer Window Container -->
  <g filter="url(#shadow)">
    <rect x="20" y="20" width="880" height="460" rx="10" fill="url(#terminalBg)" stroke="#30363d" stroke-width="1" />
  </g>

  <!-- Title Bar -->
  <rect x="20" y="20" width="880" height="40" rx="10" fill="#21262d" />
  <rect x="20" y="50" width="880" height="10" fill="#21262d" />
  <line x1="20" y1="60" x2="900" y2="60" stroke="#30363d" stroke-width="1" />

  <!-- Window Buttons -->
  <circle cx="44" cy="40" r="6" fill="#ff5f56" stroke="#e0443e" stroke-width="0.5" />
  <circle cx="64" cy="40" r="6" fill="#ffbd2e" stroke="#dea123" stroke-width="0.5" />
  <circle cx="84" cy="40" r="6" fill="#27c93f" stroke="#1aab29" stroke-width="0.5" />

  <!-- Title Text -->
  <text x="460" y="44" fill="#8b949e" font-size="12" text-anchor="middle" font-weight="500">who shell — session: target_x — cognitive twin active</text>

  <!-- Terminal Content -->
  <g font-size="13.5" line-height="1.6">
    <!-- Prompt 1 -->
    <text x="50" y="98">
      <tspan fill="#58a6ff" font-weight="600">$</tspan>
      <tspan fill="#f0f6fc"> who chat --target </tspan>
      <tspan fill="#7ee787">"Target X"</tspan>
      <tspan fill="#8b949e"> --mode formal</tspan>
    </text>

    <!-- Init Logs -->
    <text x="50" y="128" fill="#8b949e">
      <tspan fill="#3fb950">[+]</tspan> Twin instance resolved: <tspan fill="#f0f6fc" font-weight="600">profiles/target_x/vault</tspan> (GDS Graph: 5 nodes, 4 edges)
    </text>
    <text x="50" y="152" fill="#8b949e">
      <tspan fill="#3fb950">[+]</tspan> Guardrail constraints loaded: <tspan fill="#d2a8ff">[TACTICAL_TRANSACTIONALISM]</tspan> <tspan fill="#d2a8ff">[STOIC_EQUANIMITY]</tspan>
    </text>
    <text x="50" y="176" fill="#8b949e">
      <tspan fill="#3fb950">[+]</tspan> Epistemic calibration: <tspan fill="#e3b341">0.94</tspan> | Hallucination Gate: <tspan fill="#3fb950">STRICT_ZERO_SUBSTITUTION</tspan>
    </text>

    <!-- Horizontal Divider -->
    <line x1="50" y1="196" x2="870" y2="196" stroke="#21262d" stroke-width="1" stroke-dasharray="4" />

    <!-- User Query -->
    <text x="50" y="226">
      <tspan fill="#79c0ff" font-weight="600">user &gt;</tspan>
      <tspan fill="#f0f6fc"> How should we restructure the consortium governance to avoid unilateral veto deadlocks?</tspan>
    </text>

    <!-- Twin Response Badge -->
    <text x="50" y="260">
      <tspan fill="#3fb950" font-weight="700">Target X</tspan>
      <tspan fill="#8b949e"> (Calibrated Confidence: </tspan><tspan fill="#3fb950">94.2%</tspan><tspan fill="#8b949e"> | Subgame Perfect Analysis):</tspan>
    </text>

    <!-- Twin In-Character Response Lines -->
    <text x="50" y="288" fill="#c9d1d9">
      "A unilateral veto is an unstable mechanism in non-cooperative games because it inflates
    </text>
    <text x="50" y="310" fill="#c9d1d9">
      individual holdout value to infinity. To establish a robust subgame-perfect equilibrium,
    </text>
    <text x="50" y="332" fill="#c9d1d9">
      shift from absolute veto to a quadratic stake-weighted consensus combined with a dual-stage
    </text>
    <text x="50" y="354" fill="#c9d1d9">
      dispute escrow. What is the counterpart's verifiable commitment threshold?"
    </text>

    <!-- Epistemic Grounding Pill -->
    <rect x="50" y="378" width="670" height="26" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <text x="62" y="395" fill="#8b949e" font-size="11.5">
      <tspan fill="#58a6ff">EVIDENCE ANCHOR:</tspan> Mechanism Design §2.1 | Latency: 138ms | Hallucination Check: <tspan fill="#3fb950">VERIFIED</tspan>
    </text>

    <!-- Active Input Line with Blinking Cursor -->
    <text x="50" y="440">
      <tspan fill="#79c0ff" font-weight="600">user &gt;</tspan>
      <tspan fill="#f0f6fc"> Simulate counterparty refusal to sign escrow.</tspan>
      <tspan fill="#58a6ff" font-weight="700">_</tspan>
    </text>
  </g>
</svg>
