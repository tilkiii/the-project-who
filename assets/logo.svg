<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="100%" height="100%" role="img" aria-label="who?? cognitive digital twin logo">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <filter id="bloom" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Modern Squircle Base Container -->
  <rect x="6" y="6" width="128" height="128" rx="28" fill="url(#shieldGrad)" stroke="#1e293b" stroke-width="2" />

  <!-- Outer Hexagonal Identity Framework -->
  <polygon points="70,18 114,43 114,97 70,122 26,97 26,43" 
           fill="#0b1329" stroke="#1e293b" stroke-width="2.5" />
  <polygon points="70,18 114,43 114,97 70,122 26,97 26,43" 
           fill="none" stroke="url(#logoGrad)" stroke-width="1.8" stroke-dasharray="6,4" opacity="0.9" />

  <!-- Neural Graph Synapses (Connections) -->
  <!-- Outer loop -->
  <line x1="70" y1="36" x2="98" y2="52" stroke="url(#logoGrad)" stroke-width="1.8" opacity="0.55" />
  <line x1="98" y1="52" x2="98" y2="88" stroke="url(#logoGrad)" stroke-width="1.8" opacity="0.55" />
  <line x1="98" y1="88" x2="70" y2="104" stroke="url(#logoGrad)" stroke-width="1.8" opacity="0.55" />
  <line x1="70" y1="104" x2="42" y2="88" stroke="url(#logoGrad)" stroke-width="1.8" opacity="0.55" />
  <line x1="42" y1="88" x2="42" y2="52" stroke="url(#logoGrad)" stroke-width="1.8" opacity="0.55" />
  <line x1="42" y1="52" x2="70" y2="36" stroke="url(#logoGrad)" stroke-width="1.8" opacity="0.55" />

  <!-- Spokes connecting to the central cognitive core -->
  <line x1="70" y1="36" x2="70" y2="70" stroke="url(#logoGrad)" stroke-width="2.2" opacity="0.75" />
  <line x1="98" y1="52" x2="70" y2="70" stroke="url(#logoGrad)" stroke-width="2.2" opacity="0.75" />
  <line x1="98" y1="88" x2="70" y2="70" stroke="url(#logoGrad)" stroke-width="2.2" opacity="0.75" />
  <line x1="70" y1="104" x2="70" y2="70" stroke="url(#logoGrad)" stroke-width="2.2" opacity="0.75" />
  <line x1="42" y1="88" x2="70" y2="70" stroke="url(#logoGrad)" stroke-width="2.2" opacity="0.75" />
  <line x1="42" y1="52" x2="70" y2="70" stroke="url(#logoGrad)" stroke-width="2.2" opacity="0.75" />

  <!-- Latent Dimension Axis -->
  <line x1="42" y1="70" x2="98" y2="70" stroke="url(#logoGrad)" stroke-width="1.4" stroke-dasharray="3,3" opacity="0.45" />

  <!-- Peripheral Knowledge Nodes -->
  <circle cx="70" cy="36" r="4.5" fill="#2dd4bf" filter="url(#bloom)" />
  <circle cx="98" cy="52" r="4.5" fill="#38bdf8" />
  <circle cx="98" cy="88" r="4.5" fill="#818cf8" filter="url(#bloom)" />
  <circle cx="70" cy="104" r="4.5" fill="#38bdf8" />
  <circle cx="42" cy="88" r="4.5" fill="#2dd4bf" filter="url(#bloom)" />
  <circle cx="42" cy="52" r="4.5" fill="#818cf8" />

  <!-- Central Cognitive Twin Core Node -->
  <circle cx="70" cy="70" r="14" fill="#0f172a" stroke="url(#logoGrad)" stroke-width="3" filter="url(#bloom)" />
  <circle cx="70" cy="70" r="6" fill="#38bdf8" />
</svg>
