[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "the-project-who"
version = "4.5.0"
description = "Evidence-Based Cognitive Digital Twin & Behavioral Modeling Framework with Multimodal OSINT, Neo4j Graph Intelligence & ElizaOS Character Synthesis"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Mucteba Özdemir"}
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "requests>=2.31.0",
    "neo4j>=5.18.0",
    "litellm>=1.35.0",
    "networkx>=3.2.0",
    "beautifulsoup4>=4.12.0",
    "Pillow>=10.2.0",
]

[project.optional-dependencies]
ml = [
    "docling>=2.0.0",
    "paddleocr>=2.7.0",
    "whisperx>=3.1.0",
    "bertopic>=0.16.0",
    "dspy-ai>=2.4.0",
    "chromadb>=0.4.24",
    "networkx>=3.2.0",
    "scikit-learn>=1.4.0",
    "sentence-transformers>=2.5.0",
    "yt-dlp>=2024.3.10",
    "crawl4ai>=0.3.0",
    "scholarly>=1.7.0",
    "feedparser>=6.0.10"
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "black>=24.2.0",
    "ruff>=0.3.0"
]

[project.scripts]
who = "src.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
